<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wfCoralGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7E62"/>
      <stop offset="50%" stop-color="#F36C4D"/>
      <stop offset="100%" stop-color="#D95334"/>
    </linearGradient>
    <linearGradient id="wfSunGrad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#F2C572"/>
    </linearGradient>
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular emblem background -->
  <circle cx="60" cy="60" r="54" fill="url(#wfCoralGrad)" />
  
  <!-- Subtle inner rim -->
  <circle cx="60" cy="60" r="50" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="2 3"/>

  <!-- Cat Silhouette & Face in warm ivory (#FFFDF9) -->
  <g filter="url(#wfGlow)">
    <!-- Left Ear Outer -->
    <path d="M 28 52 C 27 40, 24 28, 23 20 C 32 23, 44 32, 48 40 Z" fill="#FFFDF9"/>
    <!-- Left Ear Inner -->
    <path d="M 29 46 C 28 38, 26 29, 25 24 C 31 27, 39 34, 43 40 Z" fill="#FFCBBF" opacity="0.85"/>

    <!-- Right Ear Outer -->
    <path d="M 92 52 C 93 40, 96 28, 97 20 C 88 23, 76 32, 72 40 Z" fill="#FFFDF9"/>
    <!-- Right Ear Inner -->
    <path d="M 91 46 C 92 38, 94 29, 95 24 C 89 27, 81 34, 77 40 Z" fill="#FFCBBF" opacity="0.85"/>

    <!-- Main Head / Cheeks / Chin -->
    <path d="M 32 46 
             C 42 42, 78 42, 88 46 
             C 98 54, 99 74, 91 85 
             C 82 96, 68 98, 60 98 
             C 52 98, 38 96, 29 85 
             C 21 74, 22 54, 32 46 Z" 
          fill="#FFFDF9"/>

    <!-- Serene Happy Eyes (curved arcs) -->
    <path d="M 39 59 C 42 55, 47 55, 50 59" stroke="#132227" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 70 59 C 73 55, 78 55, 81 59" stroke="#132227" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Cute Nose (little terracotta rounded triangle) -->
    <path d="M 57 66 C 58 64, 62 64, 63 66 C 63.5 67, 61 70, 60 70 C 59 70, 56.5 67, 57 66 Z" fill="#F36C4D"/>

    <!-- Gentle Mouth / Smile (stylized W shape) -->
    <path d="M 54 71 C 54 75, 59 75, 60 72 C 61 75, 66 75, 66 71" stroke="#132227" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Whisker Cheeks: Left Whiskers -->
    <path d="M 40 68 C 30 67, 18 64, 10 63" stroke="#132227" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 39 72 C 28 73, 17 73, 9 76" stroke="#132227" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 40 76 C 31 80, 20 84, 12 89" stroke="#132227" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Whisker Cheeks: Right Whiskers -->
    <path d="M 80 68 C 90 67, 102 64, 110 63" stroke="#132227" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 81 72 C 92 73, 103 73, 111 76" stroke="#132227" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 80 76 C 89 80, 100 84, 108 89" stroke="#132227" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Little Star / Sparkle in Top Center -->
    <path d="M 60 45 L 61.2 49 L 65 50.2 L 61.2 51.4 L 60 55 L 58.8 51.4 L 55 50.2 L 58.8 49 Z" fill="url(#wfSunGrad)"/>
  </g>
</svg>
