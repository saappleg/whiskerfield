<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" fill="none">
  <defs>
    <linearGradient id="wfCoralGrad" x1="120" y1="20" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7E62"/>
      <stop offset="50%" stop-color="#F36C4D"/>
      <stop offset="100%" stop-color="#D95334"/>
    </linearGradient>
    <linearGradient id="wfSunGrad" x1="150" y1="40" x2="175" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#F2C572"/>
    </linearGradient>
    <filter id="wfDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Centered Lockup: Combined Emblem + Wordmark centered at x=300 -->
  <g transform="translate(100, 0)">
    <!-- Cat Emblem (Center at x=60, y=60, radius=46) -->
    <circle cx="60" cy="60" r="46" fill="url(#wfCoralGrad)" />
    <circle cx="60" cy="60" r="42" stroke="#FFF" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 3"/>

    <!-- Cat Silhouette & Face in warm ivory (#FFFDF9) -->
    <g filter="url(#wfDrop)">
      <!-- Left Ear Outer -->
      <path d="M 33 53 C 32 42, 29 33, 28 26 C 36 29, 45 36, 49 43 Z" fill="#FFFDF9"/>
      <!-- Left Ear Inner -->
      <path d="M 34 48 C 33 42, 31 34, 30 29 C 35 32, 42 38, 46 43 Z" fill="#FFCBBF" opacity="0.85"/>

      <!-- Right Ear Outer -->
      <path d="M 87 53 C 88 42, 91 33, 92 26 C 84 29, 75 36, 71 43 Z" fill="#FFFDF9"/>
      <!-- Right Ear Inner -->
      <path d="M 86 48 C 87 42, 89 34, 90 29 C 85 32, 78 38, 74 43 Z" fill="#FFCBBF" opacity="0.85"/>

      <!-- Main Head / Cheeks / Chin -->
      <path d="M 36 49 
               C 45 45, 75 45, 84 49 
               C 93 56, 94 72, 87 81 
               C 79 90, 67 92, 60 92 
               C 53 92, 41 90, 33 81 
               C 26 72, 27 56, 36 49 Z" 
            fill="#FFFDF9"/>

      <!-- Serene Happy Eyes -->
      <path d="M 42 60 C 45 56, 49 56, 52 60" stroke="#132227" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 68 60 C 71 56, 75 56, 78 60" stroke="#132227" stroke-width="2.8" stroke-linecap="round" fill="none"/>

      <!-- Nose -->
      <path d="M 57 66 C 58 64, 62 64, 63 66 C 63.5 67, 61 70, 60 70 C 59 70, 56.5 67, 57 66 Z" fill="#F36C4D"/>

      <!-- Mouth (W) -->
      <path d="M 54 71 C 54 75, 59 75, 60 72 C 61 75, 66 75, 66 71" stroke="#132227" stroke-width="2.4" stroke-linecap="round" fill="none"/>

      <!-- Whiskers Left -->
      <path d="M 43 68 C 34 67, 24 65, 17 64" stroke="#132227" stroke-width="2" stroke-linecap="round"/>
      <path d="M 42 72 C 32 73, 23 73, 16 76" stroke="#132227" stroke-width="2" stroke-linecap="round"/>
      <path d="M 43 76 C 35 80, 26 83, 19 87" stroke="#132227" stroke-width="2" stroke-linecap="round"/>

      <!-- Whiskers Right -->
      <path d="M 77 68 C 86 67, 96 65, 103 64" stroke="#132227" stroke-width="2" stroke-linecap="round"/>
      <path d="M 78 72 C 88 73, 97 73, 104 76" stroke="#132227" stroke-width="2" stroke-linecap="round"/>
      <path d="M 77 76 C 85 80, 94 83, 101 87" stroke="#132227" stroke-width="2" stroke-linecap="round"/>

      <!-- Forehead Sparkle -->
      <path d="M 60 48 L 61 50.5 L 63.5 51.5 L 61 52.5 L 60 55 L 59 52.5 L 56.5 51.5 L 59 50.5 Z" fill="url(#wfSunGrad)"/>
    </g>

    <!-- Wordmark Typography -->
    <text x="122" y="69" 
          font-family="Georgia, 'Times New Roman', 'Source Serif Pro', serif" 
          font-size="50" 
          font-weight="bold" 
          letter-spacing="-1.2" 
          fill="#132227">Whiskerfield</text>

    <!-- Subtitle Tagline -->
    <text x="124" y="94" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="3.2" 
          fill="#F36C4D">FOR THE LIFE YOU SHARE</text>
  </g>
</svg>
